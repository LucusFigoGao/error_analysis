server:
  port: 9001

spring:
  application:
    name: rca-agent

agentscope:
  dashscope:
    # 从环境变量读，不要把 key 写进配置文件提交到 git
    api-key: ${DASHSCOPE_API_KEY}
    model-name: qwen3.6-27b
  agent:
    name: RcaAgent
  # AGENTS.md 与 skills/ 都在这个目录下
  workspace: ./workspace

agui:
  path-prefix: /wjq4709098/api
  
  # Harness 按 userId 做用户级隔离；平台请求里带 userId 时会覆盖这个默认值
  default-user-id: local

rca:
  # 故障案例材料根目录
  case-root: ./cases

logging:
  level:
    root: INFO
    com.example.rca: DEBUG
    io.agentscope: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n"