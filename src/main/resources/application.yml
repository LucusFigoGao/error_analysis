# ============================================================
# 公共配置。环境相关的东西（端口、模型通道、路径）放 profile 里：
#   application-local.yml    本地开发，DashScope 直连
#   application-server.yml   服务器部署，内网 OpenAI 兼容端点
# 切换：
#   mvn spring-boot:run                                       -> local
#   java -jar rca-agent.jar --spring.profiles.active=server   -> server
# ============================================================

spring:
  application:
    name: rca-agent
  profiles:
    active: local

agentscope:
  model:
    temperature: 0.2
    top-p: 0.8
    max-tokens: 16384
    enable-thinking: false
  agent:
    name: RcaAgent
    # 工具调用轮次上限
    max-iters: 40

agui:
  # TODO 换成比赛方分配给你的标识。
  path-prefix: /wjq4709698/api
  default-user-id: user_wjq

logging:
  level:
    root: INFO
    com.example.rca: DEBUG
    io.agentscope: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n"