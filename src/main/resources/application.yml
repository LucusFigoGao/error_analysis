server:
  port: 9001

spring:
  application:
    name: rca-agent

agentscope:
  model:
    # dashscope = 直连（本地用）
    # openai = OpenAI 兼容端点（服务器用）
    provider: dashscope
    api-key: ${DASHSCOPE_API_KEY}
    name: qwen3.6-27b
    
    # provider=openai 时必填，例如 http://<内网地址>:<端口>/v1
    base-url: ""
    temperature: 0.2    # 故障定位要稳定复现，不要发散
    top-p: 0.8
    max-tokens: 16384
    enable-thinking: false
  agent:
    name: RcaAgent
    max-iters: 40
  
  # AGENTS.md 与 skills/ 都在这个目录下
  workspace: ./workspace

agui:
  path-prefix: /wjq4709098/api
  
  # Harness 按 userId 做用户级隔离；平台请求里带 userId 时会覆盖这个默认值
  default-user-id: local

rca:
  # 故障案例材料根目录
  case-root: ./cases

logging:
  level:
    root: INFO
    com.example.rca: DEBUG
    io.agentscope: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n"